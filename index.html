<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FH</title>
</head>
<body>
  <!-- An original scene in the spirit of the town on the bridge: a railway bridge across the sea, a town of
       recycled parts on it, a great solar panel and windmills. Drawn for FH, not taken from the game. -->
  <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop class="sky1" offset="0" /><stop class="sky2" offset="1" /></linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop class="sea1" offset="0" /><stop class="sea2" offset="1" /></linearGradient>
      <radialGradient id="glow"><stop class="sun" offset="0" stop-opacity=".55" /><stop class="sun" offset="1" stop-opacity="0" /></radialGradient>
      <pattern id="arches" width="160" height="130" patternUnits="userSpaceOnUse" x="-40" y="576">
        <path class="ink" d="M0 0H160V130H148V70A68 58 0 0 0 12 70V130H0Z" />
      </pattern>
      <g id="blades"><circle r="70" fill="none" /><path d="M0 0L-4-70L4-70Z" /><path d="M0 0L-4-70L4-70Z" transform="rotate(120)" /><path d="M0 0L-4-70L4-70Z" transform="rotate(240)" /></g>
    </defs>
    <rect width="1600" height="900" fill="url(#sky)" />
    <circle cx="1190" cy="610" r="260" fill="url(#glow)" />
    <circle class="sun" cx="1190" cy="610" r="64" />
    <rect y="620" width="1600" height="280" fill="url(#sea)" />
    <g class="waves"><path d="M0 660H1600M60 700H1540M0 750H1600M120 810H1480" /></g>

    <!-- the town on the deck -->
    <g class="ink">
      <path d="M520 560V510H560V488H600V520H640V470H690V560ZM700 560V500H740V478H780V560Z" />
      <path d="M850 560V492H890V466H930V510H970V454H1010V496H1060V560ZM1070 560V516H1110V540H1140V560Z" />
      <path d="M790 560V500H830V560Z" />
      <!-- the great solar panel on its drum -->
      <path d="M760 500V470H860V500Z" />
      <ellipse cx="810" cy="462" rx="170" ry="30" />
      <path class="grid" d="M660 462H960M700 448L740 476M760 437L780 488M840 437L830 488M900 446L870 478" />
      <!-- crane -->
      <path d="M1018 454V360H1024V454ZM1000 364H1120V370H1000Z" /><path d="M1114 370V410" class="grid" />
      <!-- windmill masts -->
      <path d="M597 488V400H603V488ZM1077 516V420H1083V516ZM1167 540V446H1173V540Z" />
      <!-- the deck, the rail, the arches into the sea -->
      <rect x="-20" y="556" width="1640" height="22" />
      <rect x="-20" y="576" width="1640" height="130" fill="url(#arches)" />
    </g>
    <g class="lit">
      <rect x="532" y="522" width="6" height="8" /><rect x="652" y="486" width="6" height="8" /><rect x="668" y="510" width="6" height="8" />
      <rect x="752" y="492" width="6" height="8" /><rect x="902" y="480" width="6" height="8" /><rect x="982" y="470" width="6" height="8" />
      <rect x="1034" y="512" width="6" height="8" /><rect x="864" y="508" width="6" height="8" />
    </g>
    <g class="ink windmills">
      <g transform="translate(600 400)"><g class="mill"><use href="#blades" /></g></g>
      <g transform="translate(1080 420)"><g class="mill"><use href="#blades" /></g></g>
      <g transform="translate(1170 446)"><g class="mill"><use href="#blades" /></g></g>
    </g>
    <path class="reflect" d="M-20 712H1620" />
  </svg>
  <main id="home"></main>
  <button id="music" type="button" aria-pressed="false" title="Original ambient music, made in your browser">&#9835; Music</button>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
